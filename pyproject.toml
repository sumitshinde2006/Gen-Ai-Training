[tool.ruff]
target-version = "py311"
extend-exclude = ["myenv", ".venv", "venv", "data/chroma"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The evaluation runner sets offline/model environment flags before importing
# modules that may initialize ML libraries.
"eval/run_eval.py" = ["E402"]
